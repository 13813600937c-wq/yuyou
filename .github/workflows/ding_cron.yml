name: 钉钉每日提醒（加签版）
on:
  schedule:
    # cron 是UTC时间！北京时间 = UTC +8
    # 示例：北京时间 09:00 → UTC 01:00
    # 格式：分 时 日 月 周
    - cron: '0 1 * * *'
  # 下面这个是方便你手动点测试触发，定时不用管
  workflow_dispatch:

jobs:
  ding-remind:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 执行钉钉提醒脚本
        run: python ding_remind.py
